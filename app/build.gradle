plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boris.tvremote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.boris.tvremote'
        minSdk 26
        targetSdk 34
        versionCode 20
        versionName '2.9'
    }

    // Fixed signing key kept in the repo so every new build installs over the previous one.
    signingConfigs {
        fixed {
            storeFile file('remote.keystore')
            storePassword 'tvremote'
            keyAlias 'remote'
            keyPassword 'tvremote'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
