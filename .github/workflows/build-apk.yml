name: Build TV Remote APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Keep the same signing key between builds so updates install over the old app.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tv-remote-signing-key-v1
      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BorisTvRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BorisTvRemote-apk
          path: BorisTvRemote.apk
